<!doctype html>
<!--
  Structural stand-in for logged-in WhatsApp Web, used only by verify.mjs.
  It reproduces the hooks WAUX relies on (ids, data-testid, roles, WDS
  variables, virtualized chat rows) with WhatsApp's default dark colors, so
  the skin, privacy and overlay can be screenshot without an account.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --WDS-surface-default: #111b21;
        --WDS-background-wash-plain: #0b141a;
        --WDS-content-default: #e9edef;
        --WDS-content-deemphasized: #8696a0;
        --WDS-systems-bubble-surface-incoming: #202c33;
        --WDS-systems-bubble-surface-outgoing: #005c4b;
        --WDS-accent: #21c063;
        --WDS-surface-emphasized: #202c33;
        --WDS-systems-chat-surface-composer: #2a3942;
        --WDS-lines-divider: #222d34;
        --WDS-surface-highlight: #2a3942;
        --WDS-systems-chat-background-wallpaper: #0b141a;
        --WDS-content-on-accent: #111b21;
      }
      body { margin: 0; font: 14.2px "Segoe UI", sans-serif; background: var(--WDS-background-wash-plain); color: var(--WDS-content-default); overflow: hidden; }
      button { all: unset; cursor: pointer; }
      .shell { display: flex; height: 100vh; }
      .nav { position: relative; z-index: 100; width: 64px; flex: none; display: flex; flex-direction: column; justify-content: space-between; padding: 10px 0; background: var(--WDS-surface-default); border-right: 1px solid var(--WDS-lines-divider); box-sizing: border-box; }
      .nav section { display: flex; flex-direction: column; align-items: center; gap: 10px; }
      .nav button { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 50%; color: var(--WDS-content-deemphasized); }
      .nav button[aria-pressed="true"] { background: var(--WDS-surface-highlight); color: var(--WDS-content-default); }
      .nav svg { width: 22px; height: 22px; }
      .sidecol { width: 420px; flex: none; display: flex; border-right: 1px solid var(--WDS-lines-divider); }
      #side { flex: 1; display: flex; flex-direction: column; background: var(--WDS-surface-default); min-width: 0; }
      .side-head { display: flex; align-items: center; justify-content: space-between; height: 60px; padding: 0 20px; font-size: 22px; font-weight: 600; }
      .search { margin: 4px 14px 8px; height: 38px; border-radius: 20px; background: var(--WDS-surface-emphasized); display: flex; align-items: center; padding: 0 14px; color: var(--WDS-content-deemphasized); }
      .search input { all: unset; flex: 1; color: var(--WDS-content-default); }
      [role="tablist"] { display: flex; gap: 8px; padding: 4px 14px 10px; }
      [role="tab"] { padding: 6px 12px; border-radius: 16px; background: var(--WDS-surface-emphasized); color: var(--WDS-content-deemphasized); font-size: 14px; }
      [role="tab"][aria-selected="true"] { background: #103529; color: #d9fdd3; }
      #pane-side { flex: 1; overflow-y: auto; position: relative; }
      [data-testid="chat-list"] { position: relative; }
      [data-testid="chat-list"] [role="row"] { position: absolute; left: 0; right: 0; }
      [data-testid="chat-list"] [role="row"]:hover { background: var(--WDS-surface-highlight); }
      [data-testid="cell-frame-container"] { display: flex; align-items: center; gap: 14px; height: 100%; padding: 0 16px; box-sizing: border-box; }
      .av { width: 49px; height: 49px; border-radius: 50%; overflow: hidden; flex: none; }
      .av img { width: 100%; height: 100%; display: block; }
      .cell-text { flex: 1; min-width: 0; display: grid; gap: 2px; }
      .cell-row { display: flex; justify-content: space-between; gap: 8px; }
      [data-testid="cell-frame-title"] { font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      [data-testid="last-msg-status"] { font-size: 14px; color: var(--WDS-content-deemphasized); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .time { font-size: 12px; color: var(--WDS-content-deemphasized); }
      [data-testid="icon-unread-count"] { min-width: 20px; height: 20px; border-radius: 10px; background: var(--WDS-accent); color: var(--WDS-content-on-accent); font-size: 12px; font-weight: 600; display: grid; place-items: center; }
      .content { flex: 1; min-width: 0; display: flex; }
      #main { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--WDS-systems-chat-background-wallpaper); position: relative; }
      #main header { display: flex; align-items: center; gap: 14px; height: 60px; padding: 0 16px; background: var(--WDS-surface-default); flex: none; }
      #main header .av { width: 40px; height: 40px; }
      .head-text { display: grid; }
      .head-sub { font-size: 13px; color: var(--WDS-content-deemphasized); }
      .msgs { flex: 1; overflow-y: auto; padding: 20px 60px; display: flex; flex-direction: column; gap: 2px; }
      .msgs [role="row"] { display: flex; }
      .msgs [role="row"].out { justify-content: flex-end; }
      [data-testid="msg-container"] { max-width: 65%; padding: 6px 7px 8px 9px; border-radius: 8px; background: var(--WDS-systems-bubble-surface-incoming); position: relative; }
      .out [data-testid="msg-container"] { background: var(--WDS-systems-bubble-surface-outgoing); }
      .sender { display: block; font-size: 12.8px; font-weight: 600; color: #53bdeb; margin-bottom: 2px; }
      .meta { float: right; margin: 8px 0 -4px 10px; font-size: 11px; color: var(--WDS-content-deemphasized); }
      .day { align-self: center; margin: 10px 0; padding: 5px 12px; border-radius: 8px; background: var(--WDS-surface-emphasized); font-size: 12.5px; color: var(--WDS-content-deemphasized); }
      footer { padding: 8px 16px 12px; background: transparent; }
      .composer { display: flex; align-items: center; gap: 14px; min-height: 52px; padding: 0 16px; border-radius: 26px; background: var(--WDS-systems-chat-surface-composer); color: var(--WDS-content-deemphasized); }
      .composer [contenteditable] { flex: 1; outline: none; color: var(--WDS-content-default); }
      .intro { flex: 1; display: grid; place-items: center; background: var(--WDS-surface-default); }
      .intro-card { padding: 40px; border-radius: 24px; background: var(--WDS-surface-emphasized); text-align: center; }
      .divider { position: absolute; top: 0; bottom: 0; width: 1px; background: #2f3b43; }
    </style>
  </head>
  <body class="dark">
    <div id="app">
      <div class="app-wrapper-web color-refresh">
        <div class="shell">
          <header class="nav">
            <section data-testid="navbar-primary-section"></section>
            <section data-testid="navbar-footer-section"></section>
          </header>
          <div class="sidecol">
            <div id="side">
              <div class="side-head" data-testid="chatlist-header">WhatsApp</div>
              <div class="search" data-testid="chat-list-search-container"><input type="text" placeholder="Search or start a new chat" /></div>
              <div role="tablist"><button role="tab" aria-selected="true">All</button><button role="tab">Unread</button><button role="tab">Favourites</button><button role="tab">Groups</button></div>
              <div id="pane-side"><div data-testid="chat-list" role="grid"></div></div>
            </div>
          </div>
          <div class="content" id="content"></div>
          <div class="drawer" style="position:absolute;left:64px;top:0;bottom:0;width:420px;background:#111b21;display:none;padding:20px;box-sizing:border-box">Calls</div>
        </div>
      </div>
    </div>
    <script>
      const ICON = (title) =>
        `<svg viewBox="0 0 24 24" fill="currentColor"><title>${title}</title><rect x="4" y="4" width="16" height="16" rx="4"/></svg>`;
      const primary = document.querySelector('[data-testid="navbar-primary-section"]');
      [['wds-ic-chats-filled', true], ['wds-ic-calls', false], ['wds-ic-status-refreshed', false], ['wds-ic-channels', false], ['wds-ic-communities', false], ['wds-ic-logo-meta-ai-color', false]].forEach(([t, on]) => {
        primary.insertAdjacentHTML('beforeend', `<span><div><button data-navbar-item="true" aria-pressed="${on}">${ICON(t)}</button></div></span>`);
      });
      document.querySelector('[data-testid="navbar-footer-section"]').innerHTML =
        `<span><button data-navbar-item="true">${ICON('wds-ic-media')}</button></span><span><button data-navbar-item="true">${ICON('wds-ic-settings')}</button></span>`;
      document.getElementById('side').insertAdjacentHTML('beforeend', '<div class="promo" style="padding:14px 20px"><a href="https://www.whatsapp.com/download">Get WhatsApp for Windows</a></div>');

      const avatar = (seed) => {
        const hue = (seed * 67) % 360;
        const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40"><rect width="40" height="40" fill="hsl(${hue} 35% 38%)"/><circle cx="20" cy="16" r="7" fill="hsl(${hue} 30% 70%)"/><rect x="8" y="26" width="24" height="14" rx="7" fill="hsl(${hue} 30% 70%)"/></svg>`;
        return `data:image/svg+xml,${encodeURIComponent(svg)}`;
      };
      const chats = [
        ['Anchal', 'Sent the revised floor plan, page 3 has the changes', '09:41', 2],
        ['Amarjeet', 'Partner name is updated, we can ship today', '09:12', 0],
        ['Nisha', 'Perfect, see you at 6', '18:05', 0],
        ['Vivek', 'Voice message (0:42)', 'Mon', 0],
        ['Om', 'Meeting moved to 4 pm, same room', 'Mon', 5],
        ['Sahil', 'Call me when you land', 'Sun', 0],
        ['Gourav', 'Invoice attached for September', 'Sat', 0],
        ['Akhil', 'Leg day at 7, no excuses', 'Fri', 0],
        ['Parveen', 'Thanks for the intro!', 'Thu', 0],
        ['Esha', 'Sharing the slides tonight', 'Wed', 0],
      ];
      const list = document.querySelector('[data-testid="chat-list"]');
      list.style.height = `${chats.length * 72}px`;
      chats.forEach(([name, last, time, unread], i) => {
        list.insertAdjacentHTML(
          'beforeend',
          `<div role="row" data-testid="list-item-${i}" aria-selected="${name === 'Nisha' && !location.search.includes('nochat')}" style="height:72px;transform:translateY(${i * 72}px)">
            <div role="gridcell"><div data-testid="cell-frame-container" style="height:72px">
              ${i === 6 ? '<div class="av" style="display:grid;place-items:center;background:#3b2f4a;color:#e7c8ff;font-weight:600">RM</div>' : `<div class="av"><img src="${avatar(i + 1)}" alt=""></div>`}
              <div class="cell-text">
                <div class="cell-row"><div data-testid="cell-frame-title"><span dir="auto" title="${name}">${name}</span></div><span class="time">${time}</span></div>
                <div class="cell-row"><span data-testid="last-msg-status"><span dir="ltr">${last}</span></span>${unread ? `<span data-testid="icon-unread-count">${unread}</span>` : ''}</div>
              </div>
            </div></div>
          </div>`,
        );
      });

      const content = document.getElementById('content');
      if (location.search.includes('nochat')) {
        content.innerHTML = `<div class="intro"><div class="intro-card"><h2>Download WhatsApp for Windows</h2><p>Get extra features like voice and video calling.</p><a href="https://www.whatsapp.com/download">Download</a></div></div>`;
      } else {
        const msgs = [
          [false, 'Are we still on for the walkthrough tomorrow?', '18:02', 'Nisha'],
          [true, 'Yes. I booked the 6pm slot, the agent will meet us at the gate.', '18:04'],
          [false, 'Perfect, see you at 6', '18:05'],
          [true, 'I will bring the measurements and the signed draft.', '18:06'],
          [false, 'Can you also send the photos of the kitchen? I want to compare the light.', '18:09'],
          [true, 'Sending now.', '18:10'],
        ];
        content.innerHTML = `<div id="main">
          <header><div class="av"><img src="${avatar(3)}" alt=""></div>
            <div class="head-text"><span data-testid="conversation-info-header-chat-title"><span dir="auto">Nisha</span></span><span class="head-sub" title="online">online</span></div></header>
          <div class="wall" style="position:absolute;inset:60px 0 76px;background-image:url('data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2240%22 height=%2240%22%3E%3Ccircle cx=%2220%22 cy=%2220%22 r=%223%22 fill=%22%23ffffff10%22/%3E%3C/svg%3E');pointer-events:none"></div><div class="msgs" role="application" style="position:relative"><div class="day">Today</div>${msgs
            .map(
              ([out, text, time, sender], i) =>
                `<div role="row" class="${out ? 'out' : ''}"><div data-testid="conv-msg-${out}_${i}"><div data-testid="msg-container">${
                  sender ? `<span class="sender" dir="auto">${sender}</span>` : ''
                }<span dir="ltr">${text}</span><span class="meta">${time}</span></div></div></div>`,
            )
            .join('')}</div>
          <footer><div class="composer"><span>+</span><div contenteditable="true" role="textbox" data-tab="10"></div></div></footer>
        </div>`;
      }
      // WhatsApp's column divider, which Focus Mode must hide.
      document.querySelector('.shell').insertAdjacentHTML('beforeend', `<div class="divider" style="left:${64 + 420}px"></div>`);
    </script>
  </body>
</html>
